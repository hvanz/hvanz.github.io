<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.title }}: {{ site.description }}">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --accent: #0b6bcb;
      --card: #f6f8fa;
      --border: #d1d9e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --accent: #58a6ff;
        --card: #151b23;
        --border: #3d444d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main { max-width: 44rem; margin: 0 auto; padding: 4rem 1rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 2rem; margin: 0; }
    .headline { color: var(--muted); font-size: 1.15rem; margin: 0.25rem 0 1rem; }
    .contact { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; padding: 0; margin: 0; list-style: none; }
    h2 { font-size: 1.25rem; margin: 3rem 0 1rem; }
    .project {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .project h3 { font-size: 1.1rem; margin: 0 0 0.5rem; }
    .project .description { margin-bottom: 0.75rem; }
    .project .description p { margin: 0 0 0.5rem; }
    .project .description ul { margin: 0; padding-left: 1.25rem; }
    .project .description li { margin-bottom: 0.25rem; }
    .project .links { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>{{ site.title }}</h1>
      <p class="headline">{{ site.description }}</p>
      <ul class="contact">
        <li><a href="https://github.com/hvanz">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/hvanz/">LinkedIn</a></li>
        <li><a href="https://dblp.org/pid/12/11031.html">DBLP</a></li>
        <li><a href="https://x.com/hvanz_">X</a></li>
      </ul>
    </header>

    <section>
      <h2>Projects</h2>
      {% for project in site.data.projects %}
      <article class="project">
        <h3>{{ project.title }}</h3>
        <div class="description">{{ project.description | markdownify }}</div>
        <div class="links">
          {% for link in project.links %}<a href="{{ link.url }}">{{ link.name }} →</a>{% endfor %}
        </div>
      </article>
      {% endfor %}
    </section>

    {{ content }}
  </main>
</body>
</html>
